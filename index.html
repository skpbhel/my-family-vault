<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b0d10'><meta name='apple-mobile-web-app-capable' content='yes'><link rel='manifest' href='manifest.json'><title>My Family Vault</title><style>:root{color-scheme:dark;--b:#0b0d10;--c:#15191f;--c2:#1b2129;--t:#f5f7fa;--m:#9ca7b3;--l:#2a313a;--a:#7d9cff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding-bottom:88px}.app{max-width:620px;margin:auto}header{position:sticky;top:0;background:#0b0d10ee;backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:25px}.sub,.meta{color:var(--m);font-size:13px}.sub{margin-top:4px}main{padding:16px}.screen{display:none}.screen.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:12px}.metric{font-size:28px;font-weight:800}.section{font-size:18px;font-weight:800;margin:22px 0 10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.name{font-weight:750}button,input,select,textarea{font:inherit}.primary,.secondary{border-radius:14px;padding:12px 14px;font-weight:800}.primary{border:0;background:var(--a);color:white}.secondary{background:var(--c2);color:var(--t);border:1px solid var(--l)}.full{width:100%}input,select,textarea{width:100%;background:var(--c2);color:var(--t);border:1px solid var(--l);border-radius:12px;padding:11px}.stack>*+*{margin-top:10px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#10141a;border-top:1px solid var(--l);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}nav button{background:none;border:0;color:var(--m);font-size:12px;padding:7px 2px}nav button.active{color:white;font-weight:800}.ico{display:block;font-size:18px}.fab{position:fixed;right:18px;bottom:96px}.tabs{display:flex;gap:8px;overflow:auto}.tabs button{white-space:nowrap}.hidden{display:none!important}canvas{width:100%;height:230px;background:var(--c);border:1px solid var(--l);border-radius:18px}</style></head><body><div class='app'><header><h1 id='title'>My Family Vault</h1><div class='sub' id='subtitle'>Private family records on this device</div></header><main>
<section id='home' class='screen active'><div class='grid'><div class='card'><div class='meta'>Family members</div><div class='metric' id='memberCount'>0</div></div><div class='card'><div class='meta'>Documents</div><div class='metric' id='docCount'>0</div></div><div class='card'><div class='meta'>Health reports</div><div class='metric' id='healthCount'>0</div></div><div class='card'><div class='meta'>Reminders</div><div class='metric' id='reminderCount'>0</div></div></div><div class='section'>Quick access</div><div class='grid'><button class='card secondary' onclick="openCategory('Health')"><div class='name'>Health</div><div class='meta'>Reports & trends</div></button><button class='card secondary' onclick="openCategory('Education')"><div class='name'>Education</div><div class='meta'>Reports & certificates</div></button><button class='card secondary' onclick="openCategory('Warranty')"><div class='name'>Bills & Warranty</div><div class='meta'>Appliances & jewellery</div></button><button class='card secondary' onclick="openCategory('Insurance')"><div class='name'>Insurance</div><div class='meta'>Policies & renewals</div></button></div><div class='section'>Recent documents</div><div class='card' id='recentDocs'><div class='meta'>No documents yet.</div></div></section>
<section id='family' class='screen'><div class='section' style='margin-top:0'>Family members</div><div id='memberList'></div><button class='primary full' onclick="memberForm.classList.toggle('hidden')">＋ Add family member</button><div id='memberForm' class='card hidden' style='margin-top:12px'><div class='stack'><input id='memberName' placeholder='Name'><select id='memberRelation'><option>Self</option><option>Spouse</option><option>Son</option><option>Daughter</option><option>Parent</option><option>Other</option></select><button class='primary full' onclick='saveMember()'>Save member</button></div></div></section>
<section id='documents' class='screen'><div class='tabs'><button class='secondary' onclick="filterDocs('All')">All</button><button class='secondary' onclick="filterDocs('Health')">Health</button><button class='secondary' onclick="filterDocs('Education')">Education</button><button class='secondary' onclick="filterDocs('Warranty')">Warranty</button><button class='secondary' onclick="filterDocs('Insurance')">Insurance</button></div><div class='section'>Documents</div><div id='documentList'></div></section>
<section id='health' class='screen'><div class='stack'><select id='healthMember' onchange='renderHealth()'></select><select id='healthParam' onchange='renderHealthTrend()'></select></div><div class='section'>Health trend</div><canvas id='healthChart'></canvas><div class='card' id='healthStats'></div></section>
<section id='reminders' class='screen'><div class='section' style='margin-top:0'>Reminders</div><div id='reminderList'></div></section>
<section id='add' class='screen'><div class='section' style='margin-top:0'>Add document</div><div class='card stack'><select id='docMember'></select><select id='docCategory' onchange='configureFields()'><option>Health</option><option>Education</option><option>Warranty</option><option>Insurance</option><option>Jewellery</option><option>Certificates</option><option>Property</option><option>Vehicle</option><option>Other</option></select><input id='docTitle' placeholder='Document title'><input id='docDate' type='date'><input id='docFile' type='file' accept='application/pdf,image/*'><div id='dynamicFields'></div><textarea id='docNotes' rows='3' placeholder='Notes'></textarea><button class='primary full' onclick='saveDocument()'>Save document</button><div class='meta'>Files stay in this browser's local database on this device.</div></div></section>
</main></div><button class='primary fab' onclick="go('add')">＋ Add</button><nav><button class='active' onclick="go('home',this)"><span class='ico'>⌂</span>Home</button><button onclick="go('family',this)"><span class='ico'>👪</span>Family</button><button onclick="go('documents',this)"><span class='ico'>▤</span>Documents</button><button onclick="go('health',this)"><span class='ico'>⌁</span>Health</button><button onclick="go('reminders',this)"><span class='ico'>⏰</span>Reminders</button></nav><script>
const DB='MyFamilyVaultDB';let dbx,activeFilter='All';const titles={home:['My Family Vault','Private family records on this device'],family:['Family','Profiles for all family members'],documents:['Documents','Health, education, bills and certificates'],health:['Health','Trends by family member'],reminders:['Reminders','Warranty, insurance and expiry dates'],add:['Add Document','Save a new family record']};
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('members'))d.createObjectStore('members',{keyPath:'id'});if(!d.objectStoreNames.contains('documents'))d.createObjectStore('documents',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};r.onsuccess=()=>{dbx=r.result;res()};r.onerror=()=>rej(r.error)})}function store(n,m='readonly'){return dbx.transaction(n,m).objectStore(n)}function all(n){return new Promise((res,rej)=>{let r=store(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(n,o){return new Promise((res,rej)=>{let r=store(n,'readwrite').put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function go(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');title.textContent=titles[id][0];subtitle.textContent=titles[id][1];document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='home')renderHome();if(id==='family')renderFamily();if(id==='documents')renderDocuments();if(id==='health')prepareHealth();if(id==='reminders')renderReminders();if(id==='add')prepareAdd();scrollTo(0,0)}
async function renderHome(){let m=await all('members'),d=await all('documents');memberCount.textContent=m.filter(x=>x.id!=='household').length;docCount.textContent=d.length;healthCount.textContent=d.filter(x=>x.category==='Health').length;let today=new Date().toISOString().slice(0,10);reminderCount.textContent=d.filter(x=>x.reminderDate&&x.reminderDate>=today).length;let r=d.sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);recentDocs.innerHTML=r.length?r.map(x=>`<div class='row'><div><div class='name'>${x.title}</div><div class='meta'>${x.category} · ${x.memberName}</div></div><div class='meta'>${x.date||''}</div></div>`).join(''):`<div class='meta'>No documents yet.</div>`}
async function saveMember(){let n=memberName.value.trim();if(!n)return;await put('members',{id:'m'+Date.now(),name:n,relation:memberRelation.value});memberName.value='';memberForm.classList.add('hidden');renderFamily()}async function renderFamily(){let m=await all('members');memberList.innerHTML=m.filter(x=>x.id!=='household').map(x=>`<div class='card'><div class='name'>${x.name}</div><div class='meta'>${x.relation}</div></div>`).join('')}
async function prepareAdd(){let m=await all('members');docMember.innerHTML=m.map(x=>`<option value='${x.id}'>${x.name} · ${x.relation}</option>`).join('');docDate.value=new Date().toISOString().slice(0,10);configureFields()}function configureFields(){let c=docCategory.value,h='';if(c==='Health')h=`<input id='healthParameter' placeholder='Health parameter e.g. HbA1c'><input id='healthValue' type='number' step='any' placeholder='Value'><input id='healthUnit' placeholder='Unit e.g. %'>`;if(c==='Education')h=`<input id='schoolName' placeholder='School / institute'><input id='examName' placeholder='Exam / class / test'><input id='scoreValue' placeholder='Marks / grade / rank'>`;if(c==='Warranty'||c==='Jewellery')h=`<input id='vendor' placeholder='Brand / jeweller / vendor'><input id='item' placeholder='Item / model / serial number'><input id='expiryDate' type='date'><div class='meta'>Warranty/expiry date</div>`;if(c==='Insurance')h=`<input id='vendor' placeholder='Insurer'><input id='item' placeholder='Policy number'><input id='expiryDate' type='date'><div class='meta'>Renewal/expiry date</div>`;dynamicFields.innerHTML=h}
async function saveDocument(){let m=await all('members'),mid=docMember.value,mm=m.find(x=>x.id===mid),file=docFile.files[0],fid=null;if(file){fid='f'+Date.now();await put('files',{id:fid,name:file.name,type:file.type,blob:file})}let c=docCategory.value,e={};if(c==='Health')e={parameter:healthParameter?.value||'',value:healthValue?.value?Number(healthValue.value):null,unit:healthUnit?.value||''};if(c==='Education')e={school:schoolName?.value||'',exam:examName?.value||'',score:scoreValue?.value||''};if(['Warranty','Jewellery','Insurance'].includes(c))e={vendor:vendor?.value||'',item:item?.value||''};let rd=document.getElementById('expiryDate')?.value||null;await put('documents',{id:'d'+Date.now(),memberId:mid,memberName:mm?.name||'Household',category:c,title:docTitle.value||c+' document',date:docDate.value,fileId:fid,fileName:file?.name||'',notes:docNotes.value,reminderDate:rd,extra:e,createdAt:Date.now()});alert('Saved');go('home')}
async function renderDocuments(){let d=await all('documents');if(activeFilter!=='All')d=d.filter(x=>x.category===activeFilter);documentList.innerHTML=d.length?d.sort((a,b)=>b.createdAt-a.createdAt).map(x=>`<div class='card'><div class='name'>${x.title}</div><div class='meta'>${x.memberName} · ${x.category} · ${x.date||''}</div>${x.fileName?`<div class='meta'>Attachment: ${x.fileName}</div>`:''}</div>`).join(''):`<div class='card'><div class='meta'>No matching documents.</div></div>`}function filterDocs(c){activeFilter=c;renderDocuments()}function openCategory(c){activeFilter=c;go('documents')}
async function prepareHealth(){let m=await all('members');healthMember.innerHTML=m.filter(x=>x.id!=='household').map(x=>`<option value='${x.id}'>${x.name}</option>`).join('');renderHealth()}async function renderHealth(){let d=await all('documents');d=d.filter(x=>x.category==='Health'&&x.memberId===healthMember.value&&x.extra?.parameter);let p=[...new Set(d.map(x=>x.extra.parameter))];healthParam.innerHTML=p.map(x=>`<option>${x}</option>`).join('');renderHealthTrend()}async function renderHealthTrend(){let d=await all('documents');d=d.filter(x=>x.category==='Health'&&x.memberId===healthMember.value&&x.extra?.parameter===healthParam.value&&x.extra.value!==null).sort((a,b)=>a.date.localeCompare(b.date));let pts=d.map(x=>({date:x.date,value:x.extra.value,unit:x.extra.unit}));healthStats.innerHTML=pts.length?`<div class='row'><span>Measurements</span><b>${pts.length}</b></div><div class='row'><span>Latest</span><b>${pts.at(-1).value} ${pts.at(-1).unit||''}</b></div>`:`<div class='meta'>Add health results to see trends.</div>`;draw(pts)}function draw(p){let c=healthChart,d=devicePixelRatio||1,w=c.clientWidth,h=230;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);if(!p.length){g.fillStyle='#9ca7b3';g.font='14px -apple-system';g.fillText('No trend data yet.',18,32);return}if(p.length===1){g.fillStyle='#7d9cff';g.beginPath();g.arc(w/2,h/2,6,0,Math.PI*2);g.fill();return}let v=p.map(x=>x.value),mn=Math.min(...v),mx=Math.max(...v);if(mn===mx){mn--;mx++}let L=40,R=12,T=18,B=30,W=w-L-R,H=h-T-B,x=i=>L+i*W/(p.length-1),y=n=>T+(mx-n)/(mx-mn)*H;g.strokeStyle='#7d9cff';g.lineWidth=3;g.beginPath();p.forEach((q,i)=>i?g.lineTo(x(i),y(q.value)):g.moveTo(x(i),y(q.value)));g.stroke()}
async function renderReminders(){let d=await all('documents'),today=new Date().toISOString().slice(0,10);d=d.filter(x=>x.reminderDate).sort((a,b)=>a.reminderDate.localeCompare(b.reminderDate));reminderList.innerHTML=d.length?d.map(x=>`<div class='card'><div class='name'>${x.title}</div><div class='meta'>${x.memberName} · ${x.category}</div><div class='row'><span>Due</span><b>${x.reminderDate}</b></div></div>`).join(''):`<div class='card'><div class='meta'>No reminders yet.</div></div>`}
addEventListener('load',async()=>{await openDB();let m=await all('members');if(!m.length){await put('members',{id:'self',name:'Me',relation:'Self'});await put('members',{id:'household',name:'Household/Common',relation:'Common'})}renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})
</script></body></html>
